<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VELOCITY RUSH — a high-end 3D arcade racing game for the browser. Original cars, traffic, nitro, AI rivals." />
    <title>VELOCITY RUSH — 3D Arcade Racing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <div id="fatal" style="display:none"></div>
    <script>
      // Last-resort error surface: never leave the player staring at a blank page.
      window.addEventListener('error', function (e) {
        var el = document.getElementById('fatal');
        if (!el || el.dataset.shown) return;
        // Only take over if React never rendered anything.
        if (document.getElementById('root').children.length === 0) {
          el.dataset.shown = '1';
          el.style.display = 'flex';
          el.innerHTML = '<div style="font-family:sans-serif;color:#fff;background:#14161c;border:1px solid #e5484d;border-radius:12px;padding:28px;max-width:520px;text-align:center">'
            + '<h2 style="color:#e5484d;margin:0 0 12px">Something went wrong</h2>'
            + '<p style="opacity:.8">VELOCITY RUSH could not start. Try a browser with WebGL enabled (Chrome, Edge or Firefox) and reload.</p>'
            + '<p style="opacity:.5;font-size:12px">' + String((e && e.message) || 'unknown error').slice(0, 160) + '</p></div>';
        }
      }, true);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
